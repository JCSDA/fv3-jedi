observations:
  get values:
    variable change:
      variable change name: Model2GeoVaLs
      tropopause pressure method: thompson
      hydrometeor effective radii method: gsi
      mask over: land
  observers:
  - obs space:
      name: Aircraft
      obsdatain:
        engine:
          type: H5File
          obsfile: Data/obs/testinput_tier_1/aircraft_obs_2020121500_m.nc4
      simulated variables:
      - windEastward
      - windNorthward
      - airTemperature
    obs operator:
      name: VertInterp
      vertical coordinate: air_pressure
      observation vertical coordinate: pressure
      observation vertical coordinate group: MetaData
      interpolation method: log-linear
    obs error:
      covariance model: diagonal
    get values:
      time interpolation: linear
  - obs space:
      name: GnssroBndNBAM
      obsdatain:
        engine:
          type: H5File
          obsfile: Data/obs/testinput_tier_1/gnssro_obs_2020121500_m.nc4
      simulated variables:
      - bendingAngle
    obs operator:
      name: GnssroBndNBAM
      obs options:
        sr_steps: 2
        vertlayer: full
        use_compress: 1
        super_ref_qc: NBAM
    obs error:
      covariance model: diagonal
    get values:
      time interpolation: linear
  - obs space:
      name: AMSUA-NOAA19
      obsdatain:
        engine:
          type: H5File
          obsfile: Data/obs/testinput_tier_1/amsua_n19_obs_2020121500_m.nc4
      simulated variables:
      - brightnessTemperature
      channels: 1-15
    obs operator:
      name: CRTM
      Absorbers:
      - H2O
      - O3
      - CO2
      Clouds:
      - Water
      - Ice
      Cloud_Fraction: 1.0
      SurfaceWindGeoVars: uv
      obs options:
        Sensor_ID: amsua_n19
        EndianType: little_endian
        CoefficientPath: Data/crtm/
    obs error:
      covariance model: diagonal
    get values:
      time interpolation: linear
prints:
  frequency: PT3H
