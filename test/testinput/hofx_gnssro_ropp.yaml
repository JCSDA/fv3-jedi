observations:
  observers:
  - obs space:
      name: GnssroBndROPP1D
      obsdatain:
        engine:
          type: H5File
          obsfile: Data/obs/testinput_tier_1/gnssro_obs_2020121500_m.nc4
        obsgrouping:
          group variables:
          - sequenceNumber
          sort variable: impactHeightRO
          sort order: ascending
      obsdataout:
        engine:
          type: H5File
          obsfile: Data/hofx/GnssroBndROPP1D_hofx_gfs2020121500_m.nc4
      simulated variables:
      - bendingAngle
    obs operator:
      name:  GnssroBndROPP1D
    obs filters:
    - filter: Domain Check
      filter variables:
      - name: bendingAngle
      where :
      - variable:
          name: MetaData/impactHeightRO
        minvalue: 0
        maxvalue: 50000
    - filter: ROobserror
      filter variables:
      - name: bendingAngle
      errmodel: NRL
    - filter: Background Check
      filter variables:
      - name: bendingAngle
      threshold: 3
  - obs space:
      name: GnssroBndROPP2D
      obsdatain:
        engine:
          type: H5File
          obsfile: Data/obs/testinput_tier_1/gnssro_obs_2020121500_m.nc4
        obsgrouping:
          group variables:
          - sequenceNumber
          sort variable: impactHeightRO
          sort order: ascending
      obsdataout:
        engine:
          type: H5File
          obsfile: Data/hofx/GnssroBndROPP2D_hofx_gfs2020121500_m.nc4
      simulated variables:
      - bendingAngle
    obs operator:
      name:  GnssroBndROPP2D
      obs options:
        n_horiz: 3
        res: 40.0
        top_2d: 10.0
    obs filters:
    - filter: Domain Check
      filter variables:
      - name: bendingAngle
      where :
      - variable:
          name: MetaData/impactHeightRO
        minvalue: 0
        maxvalue: 50000
    - filter: ROobserror
      n_horiz: 3
      filter variables:
      - name: bendingAngle
      errmodel: NRL
    - filter: Background Check
      filter variables:
      - name: bendingAngle
      threshold: 3
prints:
  frequency: PT3H
test:
  reference filename: testoutput/hofx_gnssro_ropp.ref
  test output filename: testoutput/hofx_gnssro_ropp.test.out
