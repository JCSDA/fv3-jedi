input geometry:
  fms initialization:
    namelist filename: Data/fv3files/fmsmpp.nml
    field table filename: Data/fv3files/field_table_gfdl
  akbk: Data/inputs/fv3files/akbk127.nc4
  npx: 13
  npy: 13
  npz: 127
output geometry:
  akbk: Data/inputs/fv3files/akbk127.nc4
  npx: 13
  npy: 13
  npz: 127
variable change:
  variable change name: Model2GeoVaLs
  hydrometeor effective radii method: gsi
  mask over: land
  input variables: &inputvars
  - eastward_wind
  - northward_wind
  - air_temperature
  - air_pressure_thickness
  - water_vapor_mixing_ratio_wrt_moist_air
  - cloud_liquid_ice
  - cloud_liquid_water
  - ozone_mass_mixing_ratio
  - geopotential_height_times_gravity_at_surface
  - slmsk
  - sheleg
  - skin_temperature_at_surface
  - vtype
  - stype
  - vfrac
  - stc
  - soilMoistureVolumetric
  - totalSnowDepth
  - eastward_wind_at_surface
  - northward_wind_at_surface
  - f10m
  output variables:
  - relative_humidity
  - air_pressure_at_surface
  - virtual_temperature
  - mole_fraction_of_ozone_in_air
  - geopotential_height
  - height_above_mean_sea_level_at_surface
  - mole_fraction_of_carbon_dioxide_in_air
  - water_vapor_mixing_ratio_wrt_dry_air
  - mass_content_of_cloud_liquid_water_in_atmosphere_layer
  - mass_content_of_cloud_ice_in_atmosphere_layer
  - effective_radius_of_cloud_liquid_water_particle
  - effective_radius_of_cloud_ice_particle
  - water_area_fraction
  - land_area_fraction
  - ice_area_fraction
  - surface_snow_area_fraction
  - skin_temperature_at_surface_where_sea
  - skin_temperature_at_surface_where_land
  - skin_temperature_at_surface_where_ice
  - skin_temperature_at_surface_where_snow
  - surface_snow_thickness
  - vegetation_area_fraction
  - wind_speed_at_surface
  - wind_from_direction_at_surface
  - leaf_area_index
  - volume_fraction_of_condensed_water_in_soil
  - soil_temperature
  - land_type_index_NPOESS
  - vegetation_type_index
  - soil_type
  - air_upward_absolute_vorticity
  - tropopause_pressure
states:
- input:
    datetime: 2020-12-15T00:00:00Z
    filetype: fms restart
    state variables: *inputvars
    datapath: Data/inputs/gfs_c12/bkg/
    filename_core: 20201215.000000.fv_core.res.nc
    filename_trcr: 20201215.000000.fv_tracer.res.nc
    filename_sfcd: 20201215.000000.sfc_data.nc
    filename_sfcw: 20201215.000000.fv_srf_wnd.res.nc
    filename_cplr: 20201215.000000.coupler.res
    field io names: &field_io_names
      eastward_wind: ua
      northward_wind: va
      air_temperature: T
      air_pressure_thickness: delp
      water_vapor_mixing_ratio_wrt_moist_air: sphum
      cloud_liquid_ice: ice_wat
      cloud_liquid_water: liq_wat
      ozone_mass_mixing_ratio: o3mr
      geopotential_height_times_gravity_at_surface: phis
      skin_temperature_at_surface: tsea
      soilMoistureVolumetric: smc
      totalSnowDepth: snwdph
      eastward_wind_at_surface: u_srf
      northward_wind_at_surface: v_srf
      relative_humidity: rh
      air_pressure_at_surface: ps
      virtual_temperature: tv
      mole_fraction_of_ozone_in_air: o3ppmv
      mole_fraction_of_carbon_dioxide_in_air: co2
      air_upward_absolute_vorticity: vort
  output:
   filetype: cube sphere history
   provider: geos
   datapath: Data/
   filename: geovals.gfs.%yyyy%mm%dd_%hh%MM%ssz.nc4
   field io names: *field_io_names
test:
  reference filename: testoutput/convertstate_gfs_model2geovals.ref
  test output filename: testoutput/convertstate_gfs_model2geovals.test.out
