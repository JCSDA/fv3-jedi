geometry:
  fms initialization:
    namelist filename: Data/fv3files/fmsmpp.nml
    field table filename: Data/fv3files/field_table_gfdl
  akbk: Data/inputs/fv3files/akbk127.nc4
  layout:
  - 1
  - 1
  io_layout:
  - 1
  - 1
  npx: 13
  npy: 13
  npz: 127
background:
  datetime: 2020-12-15T00:00:00Z
  filetype: fms restart
  datapath: Data/inputs/gfs_c12/bkg/
  filename_core: 20201215.000000.fv_core.res.nc
  filename_trcr: 20201215.000000.fv_tracer.res.nc
  filename_sfcd: 20201215.000000.sfc_data.nc
  filename_sfcw: 20201215.000000.fv_srf_wnd.res.nc
  filename_cplr: 20201215.000000.coupler.res
  state variables: &anavars
  - eastward_wind
  - northward_wind
  - air_temperature
  - air_pressure_at_surface
  - water_vapor_mixing_ratio_wrt_moist_air
  - cloud_liquid_ice
  - cloud_liquid_water
  - ozone_mass_mixing_ratio
  field io names: &field_io_names
    eastward_wind: ua
    northward_wind: va
    air_temperature: T
    air_pressure_at_surface: ps
    water_vapor_mixing_ratio_wrt_moist_air: sphum
    cloud_liquid_ice: ice_wat
    cloud_liquid_water: liq_wat
    ozone_mass_mixing_ratio: o3mr
    mole_fraction_of_ozone_in_air: o3ppmv
background error:
  covariance model: SABER
  saber central block:
    saber block name: gsi static covariance
    read:
      gsi akbk: Data/inputs/fv3files/akbk127.nc4
      gsi error covariance file: Data/inputs/nmcbalance/gsi-coeffs-gfs-global-l127x192y96.nc4
      gsi berror namelist file: Data/gsibec/gfs_gsi_global_192x96x127.nml
      processor layout x direction: 3
      processor layout y direction: 2
      debugging mode: false
  saber outer blocks:
  - saber block name: interpolation
    inner geometry:
      function space: StructuredColumns
      custom grid matching gsi:
        type: gaussian
        lats: 96
        lons: 192
      custom partitioner matching gsi:
        bands: 2
      halo: 1
    forward interpolator:
      local interpolator type: oops unstructured grid interpolator
    inverse interpolator:
      local interpolator type: oops unstructured grid interpolator
    state variables to inverse:
    - eastward_wind
    - northward_wind
    - air_temperature
    - air_pressure_at_surface
    - water_vapor_mixing_ratio_wrt_moist_air
    - cloud_liquid_ice
    - cloud_liquid_water
    - ozone_mass_mixing_ratio
  linear variable change:
    linear variable change name: Control2Analysis
    input variables:
    - eastward_wind
    - northward_wind
    - air_temperature
    - air_pressure_at_surface
    - water_vapor_mixing_ratio_wrt_moist_air
    - cloud_liquid_ice
    - cloud_liquid_water
    - mole_fraction_of_ozone_in_air
    output variables: *anavars
dirac:
  ndir: 1
  ixdir:
  - 6
  iydir:
  - 6
  ildir:
  - 50
  itdir:
  - 1
  ifdir:
  - eastward_wind
output dirac:
  filetype: cube sphere history
  provider: geos
  datapath: Data/
  filename: gsi_dirac_%id%_.%yyyy%mm%dd_%hh%MM%ssz.nc4
  field io names: *field_io_names
test:
  reference filename: testoutput/dirac_gfs_gsi_global.ref
  test output filename: testoutput/dirac_gfs_gsi_global.test.out
