cost function:
  cost type: 4D-Ens-Var
  analysis variables: &avars
  - eastward_wind
  - northward_wind
  - air_temperature
  - air_pressure_at_surface
  - water_vapor_mixing_ratio_wrt_moist_air
  - cloud_liquid_ice
  - cloud_liquid_water
  - rain_water
  - snow_water
  - mole_fraction_of_ozone_in_air
  - geopotential_height_times_gravity_at_surface
  - fraction_of_ocean
  - fraction_of_lake
  - fraction_of_ice
  - skin_temperature_at_surface
  time window:
    begin: 2020-12-14T21:00:00Z
    length: PT6H
  subwindow: PT3H
  parallel subwindows: false
  geometry:
    fms initialization:
      namelist filename: Data/fv3files/input_geos_c12.nml
      field table filename: Data/fv3files/field_table_gmao
    akbk: Data/inputs/fv3files/akbk72.nc4
#   layout: [1,1]
    npx: 13
    npy: 13
    npz: 72
  background:
    states:
    - datetime: 2020-12-14T21:00:00Z
      filetype: cube sphere history
      provider: geos
      datapath: Data/inputs/geos_c12
      filename: geos.bkg.20201214_210000z.nc4
      state variables: &statevars
      - eastward_wind
      - northward_wind
      - air_temperature
      - air_pressure_thickness
      - air_pressure_at_surface
      - water_vapor_mixing_ratio_wrt_moist_air
      - cloud_liquid_ice
      - cloud_liquid_water
      - rain_water
      - snow_water
      - mole_fraction_of_ozone_in_air
      - geopotential_height_times_gravity_at_surface
      - fraction_of_ocean
      - fraction_of_lake
      - fraction_of_ice
      - sheleg
      - skin_temperature_at_surface
#     - vtype
#     - stype
#     - vfrac
      - soilt
      - soilm
      - eastward_wind_at_surface
      - northward_wind_at_surface
      field io names: &field_io_names
        eastward_wind: ua
        northward_wind: va
        air_temperature: t
        air_pressure_at_surface: ps
        water_vapor_mixing_ratio_wrt_moist_air: q
        mole_fraction_of_ozone_in_air: o3ppmv
        cloud_liquid_ice: qi
        cloud_liquid_water: ql
        rain_water: qr
        snow_water: qs
        geopotential_height_times_gravity_at_surface: phis
        fraction_of_ocean: frocean
        fraction_of_lake: frlake
        fraction_of_ice: frseaice
        skin_temperature_at_surface: ts
        air_pressure_thickness: delp
        eastward_wind_at_surface: u10m
        northward_wind_at_surface: v10m
    - datetime: 2020-12-15T00:00:00Z
      filetype: cube sphere history
      provider: geos
      datapath: Data/inputs/geos_c12
      filename: geos.bkg.20201215_000000z.nc4
      state variables: *statevars
      field io names: *field_io_names
    - datetime: 2020-12-15T03:00:00Z
      filetype: cube sphere history
      provider: geos
      datapath: Data/inputs/geos_c12
      filename: geos.bkg.20201215_030000z.nc4
      state variables: *statevars
      field io names: *field_io_names
#----------------------------------------------------------
  background error:
    covariance model: SABER
    covariance type: gsi hybrid covariance
    saber central block:
      saber block name: gsi hybrid covariance
      read:
        gsi akbk: Data/inputs/fv3files/akbk72.nc4
        gsi error covariance file: Data/inputs/nmcbalance/gsi-coeffs-geos-global-l72x72y46.nc4
        gsi berror namelist file: Data/gsibec/geos_hyb4dgsi_global_72x46x72.nml
        processor layout x direction: 3
        processor layout y direction: 2
        debugging mode: false
    saber outer blocks:
    - saber block name: interpolation
      inner geometry:
        function space: StructuredColumns
        custom grid matching gsi:
          type: latlon
          lats: 46
          lons: 72
        custom partitioner matching gsi:
          bands: 2
        halo: 1
      forward interpolator:
        local interpolator type: oops unstructured grid interpolator
      inverse interpolator:
        local interpolator type: oops unstructured grid interpolator
      state variables to inverse: &bvars
      - eastward_wind
      - northward_wind
      - air_temperature
      - air_pressure_at_surface
      - water_vapor_mixing_ratio_wrt_moist_air
      - cloud_liquid_ice
      - cloud_liquid_water
      - rain_water
      - snow_water
      - mole_fraction_of_ozone_in_air
      - geopotential_height_times_gravity_at_surface
      - fraction_of_ocean
      - fraction_of_lake
      - fraction_of_ice
      - skin_temperature_at_surface
    linear variable change:
      linear variable change name: Control2Analysis
      input variables: *bvars
      output variables: *avars

#---------------------------------
  observations:
    observers:
    - obs space:
        name: Radiosonde
        obsdatain:
          engine:
            type: H5File
            obsfile: Data/obs/testinput_tier_1/sondes_obs_2020121500_m.nc4
        obsdataout:
          engine:
            type: H5File
            obsfile: Data/hofx/sondes_hyb-3dvar-geos_2020121500_m.nc4
        simulated variables:
        - windEastward
        - windNorthward
        - airTemperature
        - stationPressure
        - specificHumidity
      obs operator:
        name: Composite
        components:
        - name: VertInterp
          variables:
          - name: windEastward
          - name: windNorthward
          - name: airTemperature
          - name: specificHumidity
        - name: SfcCorrected
          variables:
          - name: stationPressure
          correction scheme to use: GSL
      linear obs operator:
        name: Composite
        components:
        - name: VertInterp
          variables:
          - name: windEastward
          - name: windNorthward
          - name: airTemperature
          - name: specificHumidity
        - name: Identity
          variables:
          - name: stationPressure
      obs error:
        covariance model: diagonal
      obs filters:
      - filter: PreQC
        maxvalue: 4
      - filter: Perform Action
        filter variables:
        - windEastward
        - windNorthward
        - airTemperature
        - specificHumidity
        action:
          name: assign error
          error function:
            name: GsiFinalObsError/specificHumidity
      - filter: Perform Action
        filter variables:
        - stationPressure
        action:
          name: assign error
          error function:
            name: GsiFinalObsError/stationPressure

final:
  diagnostics:
    departures: oman
output:
  filetype: cube sphere history
  provider: geos
  datapath: Data/analysis
  filename: hyb-4denvar-sondes-geos.ana.%yyyy%mm%dd_%hh%MM%ssz.nc4
# first: PT0H
  frequency: PT3H
variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - ninner: 5
    gradient norm reduction: 1e-10
##  test: on
    geometry:
      akbk: Data/inputs/fv3files/akbk72.nc4
#     layout: [1,1]
      npx: 13
      npy: 13
      npz: 72
    diagnostics:
      departures: ombg
