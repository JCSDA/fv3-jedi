input geometry:
  fms initialization:
    namelist filename: Data/fv3files/fmsmpp.nml
    field table filename: Data/fv3files/field_table_gmao
  akbk: Data/inputs/fv3files/akbk72.nc4
  npx: 13
  npy: 13
  npz: 72
output geometry:
  akbk: Data/inputs/fv3files/akbk72.nc4
  npx: 25
  npy: 25
  npz: 72
states:
- input:
    datetime: 2020-12-14T21:00:00Z
    filetype: cube sphere history
    provider: geos
    datapath: Data/inputs/geos_c12
    filenames:
    - geos.bkg.20201214_210000z.nc4
    - geos.bkg.crtmsrf.20201214_210000z.nc4
    state variables:
    - eastward_wind
    - northward_wind
    - air_temperature
    - air_pressure_thickness
    - water_vapor_mixing_ratio_wrt_moist_air
    - cloud_liquid_ice
    - cloud_liquid_water
    - mole_fraction_of_ozone_in_air
    field io names: &field_io_names
      eastward_wind: ua
      northward_wind: va
      air_temperature: t
      air_pressure_thickness: delp
      water_vapor_mixing_ratio_wrt_moist_air: q
      cloud_liquid_ice: qi
      cloud_liquid_water: ql
      mole_fraction_of_ozone_in_air: o3ppmv
  output:
   filetype: cube sphere history
   provider: geos
   datapath: Data/
   filename: geos.bkg.converted.%yyyy%mm%dd_%hh%MM%ssz.nc4
  field io names: *field_io_names
- input:
    datetime: 2020-12-14T21:00:00Z
    filetype: cube sphere history
    provider: geos
    datapath: Data/inputs/geos_c12
    compute edge pressure from surface pressure: True
    filenames:
    - geos.bkg.20201214_210000z.nc4
    - geos.bkg.crtmsrf.20201214_210000z.nc4
    state variables:
    - air_pressure_at_surface
    - air_pressure_levels
    field io names: &field_io_names
      air_pressure_at_surface: ps
      air_pressure_levels: pe
  output:
   filetype: cube sphere history
   provider: geos
   datapath: Data/
   filename: geos.pe.bkg.converted.%yyyy%mm%dd_%hh%MM%ssz.nc4
- input:
    analytic init:
      method: dcmip-test-1-1
    datetime: 2020-12-14T21:00:00Z
  output:
    filetype: cube sphere history
    provider: geos
    datapath: Data/
    filename: geos.dcmip-test-1-1.converted.%yyyy%mm%dd_%hh%MM%ssz.nc4
  field io names: *field_io_names
- input:
    analytic init:
      method: dcmip-test-1-2
    datetime: 2020-12-14T21:00:00Z
  output:
    filetype: cube sphere history
    provider: geos
    datapath: Data/
    filename: geos.dcmip-test-1-2.converted.%yyyy%mm%dd_%hh%MM%ssz.nc4
  field io names: *field_io_names
- input:
    analytic init:
      method: dcmip-test-3-1
    datetime: 2020-12-14T21:00:00Z
  output:
    filetype: cube sphere history
    provider: geos
    datapath: Data/
    filename: dcmip-test-3-1.%yyyy%mm%dd_%hh%MM%ssz.nc4
  field io names: *field_io_names
test:
  reference filename: testoutput/convertstate_geos.ref
  test output filename: testoutput/convertstate_geos.test.out
