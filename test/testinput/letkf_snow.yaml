geometry:
  fms initialization:
    namelist filename: Data/fv3files/fmsmpp.nml
    field table filename: Data/fv3files/field_table
  akbk: Data/inputs/fv3files/akbk127.nc4
  npx: 49
  npy: 49
  npz: 127
  time invariant fields:
    state fields:
      datetime: 2023-05-01T12:00:00Z
      filetype: fms restart
      skip coupler file: true
      state variables:
      - filtered_orography
      datapath: Data/inputs/gfs_land_c48/grid/
      filename_orog: C48_oro_data.nc
      field io names: &field_io_names
        filtered_orography: orog_filt
        totalSnowDepth: snodl
    derived fields:
    - nominal_surface_pressure
  field interpolation methods:
    totalSnowDepth: 'nearest'
    vtype: 'nearest'
    slmsk: 'nearest'
time window:
  begin: 2023-05-01T00:00:00Z
  length: PT24H
background:
 members:
   - datetime: 2023-05-01T12:00:00Z
     filetype: fms restart
     state variables:
     - totalSnowDepth
     - vtype
     - slmsk
     datapath: Data/inputs/gfs_land_c48/mem001/
     filename_sfcd: 20230501.120000.sfc_data.nc
     filename_cplr: 20230501.120000.coupler.res
     field io names: *field_io_names
   - datetime: 2023-05-01T12:00:00Z
     filetype: fms restart
     state variables:
     - totalSnowDepth
     - vtype
     - slmsk
     datapath: Data/inputs/gfs_land_c48/mem002/
     filename_sfcd: 20230501.120000.sfc_data.nc
     filename_cplr: 20230501.120000.coupler.res
     field io names: *field_io_names
observations:
  observers:
  - obs space:
      name: Simulate
      distribution:
        name: InefficientDistribution
      simulated variables:
      - totalSnowDepth
      obsdatain:
        engine:
          type: H5File
          obsfile: Data/obs/testinput_tier_1/ghcn_snwd_ioda_20230501.nc
    obs operator:
      name: Identity
    obs error:
      covariance model: diagonal
    obs localizations:
    - localization method: Horizontal SOAR
      lengthscale: 250e3
      soar horizontal decay: 0.000021
      max nobs: 50
    - localization method: Vertical Brasnett
      vertical lengthscale: 700
    obs filters:
    - filter: Bounds Check
      filter variables:
      - name: totalSnowDepth
      minvalue: 0.0
      maxvalue: 10000.0
    - filter: Domain Check
      where:
      - variable:
          name: MetaData/stationElevation
        minvalue: -999.0
        maxvalue: 10000.0
    - filter: Domain Check
      where:
      - variable:
          name: GeoVaLs/slmsk
        minvalue: 0.5
        maxvalue: 1.5
    - filter: RejectList
      where:
      - variable:
          name: GeoVaLs/vtype
        minvalue: 14.5
        maxvalue: 15.5
    - filter: Background Check
      filter variables:
      - name: totalSnowDepth
      threshold: 6.25
      action:
        name: reject
driver:
  save posterior mean: true
  save posterior mean increment: true
  save posterior ensemble: false
  update obs config with geometry info: false
local ensemble DA:
  solver: Deterministic LETKF
  inflation:
    rtps: 0.0
    rtpp: 0.0
    mult: 1.0
output:
  filetype: auxgrid
  gridtype: latlon
  filename: Data/analysis/letkf/gfs_land/mem%{member}%/letkf.
  field io names: *field_io_names
output increment:
  filetype: auxgrid
  gridtype: latlon
  filename: Data/analysis/letkf/gfs_land/mem%{member}%/xainc.
  field io names: *field_io_names
test:
  reference filename: testoutput/letkf_snow.ref
  test output filename: testoutput/letkf_snow.test.out
