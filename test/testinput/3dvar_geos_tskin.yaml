cost function:
  cost type: 3D-Var
  analysis variables: &avars
  - air_pressure_at_surface
  - skin_temperature_at_surface
  - fraction_of_ocean
  - fraction_of_lake
  - fraction_of_ice
  - fraction_of_land
  time window:
    begin: 2020-12-14T21:00:00Z
    length: PT6H
  geometry:
    fms initialization:
      namelist filename: Data/fv3files/input_geos_c12.nml
      field table filename: Data/fv3files/field_table_gmao
    akbk: Data/inputs/fv3files/akbk72.nc4
    npx: 13
    npy: 13
    npz: 72
  background:
    datetime: 2020-12-15T00:00:00Z
    filetype: cube sphere history
    provider: geos
    datapath: Data/inputs/geos_c12
    filename: geos.bkg.20201215_000000z.nc4
    state variables:
    - air_pressure_at_surface
    - air_pressure_thickness
    - geopotential_height_times_gravity_at_surface
    - sheleg
    - skin_temperature_at_surface
    - fraction_of_ocean
    - fraction_of_land
    - fraction_of_ice
    - fraction_of_lake
    field io names: &field_io_names
      air_pressure_at_surface: ps
      skin_temperature_at_surface: ts
      fraction_of_ocean: frocean
      fraction_of_lake: frlake
      fraction_of_ice: frseaice
      fraction_of_land: frland
      air_pressure_thickness: delp
      geopotential_height_times_gravity_at_surface: phis
  background error:
    covariance model: SABER
    saber central block:
      saber block name: gsi static covariance
      read:
        gsi akbk: Data/inputs/fv3files/akbk72.nc4
        gsi error covariance file: Data/inputs/nmcbalance/gsi-coeffs-geos-global-l72x72y46.nc4
        gsi berror namelist file: Data/gsibec//geos_gsi_global_tskin_72x46x72.nml
        processor layout x direction: 3
        processor layout y direction: 2
        debugging mode: false
    saber outer blocks:
    - saber block name: interpolation
      inner geometry:
        function space: StructuredColumns
        custom grid matching gsi:
          type: latlon
          lats: 46
          lons: 72
        custom partitioner matching gsi:
          bands: 2
        halo: 1
      forward interpolator:
        local interpolator type: oops unstructured grid interpolator
      inverse interpolator:
        local interpolator type: oops unstructured grid interpolator
      state variables to inverse:
      - air_pressure_at_surface
      - geopotential_height_times_gravity_at_surface
      - skin_temperature_at_surface
      - fraction_of_land
      - fraction_of_ocean
      - fraction_of_lake
      - fraction_of_ice
    linear variable change:
      linear variable change name: Control2Analysis
      input variables:
      - air_pressure_at_surface
      - skin_temperature_at_surface
      - fraction_of_land
      - fraction_of_ocean
      - fraction_of_lake
      - fraction_of_ice
      output variables: *avars
  observations:
    observers:
    - obs space:
        name: SeaSurfaceTemp
        obsdatain:
          engine:
            type: H5File
            obsfile: Data/obs/testinput_tier_1/sst_obs_2020121500.nc4
        obsdataout:
          engine:
            type: H5File
            obsfile: Data/hofx/sst_gmi_hofx_gfs_2020121500_m.nc4
        simulated variables:
        - seaSurfaceTemperature
      obs operator:
        name: Identity
        observation alias file: testinput/obsop_name_map.yaml
      obs error:
        covariance model: diagonal
final:
  diagnostics:
    departures: oman
output:
  filetype: cube sphere history
  provider: geos
  datapath: Data/analysis
  filename: 3dvars-geos-tskin.ana.%yyyy%mm%dd_%hh%MM%ssz.nc4
  first: PT0H
  frequency: PT1H
  field io names: *field_io_names
variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - ninner: 5
    gradient norm reduction: 1e-10
    geometry:
      akbk: Data/inputs/fv3files/akbk72.nc4
      npx: 13
      npy: 13
      npz: 72
    diagnostics:
      departures: ombg
test:
  reference filename: testoutput/3dvar_geos_tskin.ref
  float relative tolerance: 1.0e-2
  integer tolerance: 3
  test output filename: testoutput/3dvar_geos_tskin.test.out
