geometry:
  fms initialization:
    namelist filename: Data/fv3files/input_gfs_c12.nml
    field table filename: Data/fv3files/field_table_gmao
  akbk: Data/inputs/fv3files/akbk127.nc4
  npx: 13
  npy: 13
  npz: 127
linear model:
  name: HTLM
  simple linear model:
    linear model:
      name: FV3JEDITLM
      namelist filename: Data/fv3files/input_gfs_c12.nml
      linear model namelist filename: Data/fv3files/inputpert_4dvar.nml
      tstep: PT1H
      lm_do_dyn: 1
      lm_do_trb: 0
      lm_do_mst: 0
  update tstep: PT3H
  variables: &vars
  - eastward_wind
  - northward_wind
  - air_temperature
  - air_pressure_thickness
  - water_vapor_mixing_ratio_wrt_moist_air
  - cloud_liquid_water
  - cloud_liquid_ice
  - ozone_mass_mixing_ratio
  - geopotential_height_times_gravity_at_surface
  coefficients:
    update variables:
    - eastward_wind
    - northward_wind
    influence region size: 3
    time window:
      begin: 2020-12-14T21:00:00Z
      length: PT3H
    calculator:
    ensemble:
      model:
        name: FV3LM
        use internal namelist: true
        tstep: PT1H
        lm_do_dyn: 1
        lm_do_trb: 0
        lm_do_mst: 0
        datapath: Data/inputs/gfs_c12/bkg/
        filename_core: 20201214.210000.fv_core.res.nc
        filename_core_out: checkpoint.linearization_error_ens.fv_core.res.nc
        datapath_out: Data/forecast
      model geometry:
        fms initialization:
          namelist filename: Data/fv3files/input_gfs_c12.nml
          field table filename: Data/fv3files/field_table_gmao
        akbk: Data/inputs/fv3files/akbk127.nc4
        npx: 13
        npy: 13
        npz: 127
      nonlinear control:
        datetime: 2020-12-14T21:00:00Z
        filetype: fms restart
        datapath: Data/inputs/gfs_c12/bkg/
        filename_core: 20201214.210000.fv_core.res.nc
        filename_trcr: 20201214.210000.fv_tracer.res.nc
        filename_sfcd: 20201214.210000.sfc_data.nc
        filename_sfcw: 20201214.210000.fv_srf_wnd.res.nc
        filename_cplr: 20201214.210000.coupler.res
        state variables: &bgvars
        - eastward_wind
        - northward_wind
        - air_temperature
        - air_pressure_thickness
        - water_vapor_mixing_ratio_wrt_moist_air
        - cloud_liquid_water
        - cloud_liquid_ice
        - ozone_mass_mixing_ratio
        - geopotential_height_times_gravity_at_surface
        field io names: &field_io_names
          eastward_wind: ua
          northward_wind: va
          air_temperature: T
          air_pressure_thickness: delp
          water_vapor_mixing_ratio_wrt_moist_air: sphum
          cloud_liquid_water: liq_wat
          cloud_liquid_ice: ice_wat
          ozone_mass_mixing_ratio: o3mr
          geopotential_height_times_gravity_at_surface: phis
      nonlinear ensemble:
        read:
          members from template:
            template:
              datetime: 2020-12-14T21:00:00Z
              filetype: fms restart
              state variables: *bgvars
              datapath: Data/inputs/gfs_c12/mem%mem%/
              filename_core: 20201214.210000.fv_core.res.nc
              filename_trcr: 20201214.210000.fv_tracer.res.nc
              filename_sfcd: 20201214.210000.sfc_data.nc
              filename_sfcw: 20201214.210000.fv_srf_wnd.res.nc
              filename_cplr: 20201214.210000.coupler.res
              field io names: *field_io_names
            pattern: '%mem%'
            nmembers: 5
            zero padding: 3
model aux increment: {}

model:
  name: FV3LM
  use internal namelist: true
  tstep: PT15M
  lm_do_dyn: 1
  lm_do_trb: 0
  lm_do_mst: 0
  datapath: Data/inputs/gfs_c12/bkg/
  filename_core: 20201214.210000.fv_core.res.nc
  filename_core_out: checkpoint.linearization_error.fv_core.res.nc
  datapath_out: Data/forecast
model aux control: null
forecast length: PT3H
time resolution: PT3H
x1:
  datetime: 2020-12-14T21:00:00Z
  filetype: fms restart
  datapath: Data/inputs/gfs_c12/bkg/
  filename_core: 20201214.210000.fv_core.res.nc
  filename_trcr: 20201214.210000.fv_tracer.res.nc
  filename_sfcd: 20201214.210000.sfc_data.nc
  filename_sfcw: 20201214.210000.fv_srf_wnd.res.nc
  filename_cplr: 20201214.210000.coupler.res
  state variables: *bgvars
  field io names: *field_io_names
x2:
  datetime: 2020-12-14T21:00:00Z
  filetype: fms restart
  datapath: Data/inputs/gfs_c12/mem001/
  filename_core: 20201214.210000.fv_core.res.nc
  filename_trcr: 20201214.210000.fv_tracer.res.nc
  filename_sfcd: 20201214.210000.sfc_data.nc
  filename_sfcw: 20201214.210000.fv_srf_wnd.res.nc
  filename_cplr: 20201214.210000.coupler.res
  state variables: *bgvars
  field io names: *field_io_names
compute error: true
output:
  dx:
    structured grid:
      local interpolator type: oops unstructured grid interpolator
      grid type: latlon
      type: inc
      resolution in degrees: 6.0
      all model levels: true
      bottom model level: false
      variables to output:
      - eastward_wind
      - northward_wind
      - air_temperature
      - air_pressure_thickness
      - water_vapor_mixing_ratio_wrt_moist_air
      datapath: Data
      exp: linearization-error-HTLM-dx
  error:
    structured grid:
      local interpolator type: oops unstructured grid interpolator
      grid type: latlon
      type: inc
      resolution in degrees: 6.0
      all model levels: true
      bottom model level: false
      variables to output:
      - eastward_wind
      - northward_wind
      - air_temperature
      - air_pressure_thickness
      - water_vapor_mixing_ratio_wrt_moist_air
      datapath: Data
      exp: linearization-error-HTLM-error
test:
  reference filename: testoutput/tlm_toolbox_linearization_error.ref
  test output filename: testoutput/tlm_toolbox_linearization_error.test.out
  float relative tolerance: 1.0e-5
