geometry:
  fms initialization:
    namelist filename: Data/fv3files/fmsmpp.nml
    field table filename: Data/fv3files/field_table_gfdl
  akbk: Data/inputs/fv3files/akbk127.nc4
  layout:
  - 1
  - 2
  npx: 13
  npy: 13
  npz: 127
background:
  datetime: 2020-12-15T00:00:00Z
  filetype: fms restart
  state variables: &state_vars
  - eastward_wind
  - northward_wind
  - air_temperature
  - air_pressure_at_surface
  - water_vapor_mixing_ratio_wrt_moist_air
  - cloud_liquid_water
  - ozone_mass_mixing_ratio
  datapath: Data/inputs/gfs_c12/bkg
  filename_core: 20201215.000000.fv_core.res.nc
  filename_trcr: 20201215.000000.fv_tracer.res.nc
  filename_sfcd: 20201215.000000.sfc_data.nc
  filename_sfcw: 20201215.000000.fv_srf_wnd.res.nc
  filename_cplr: 20201215.000000.coupler.res
  field io names: &field_io_names
    eastward_wind: ua
    northward_wind: va
    air_temperature: T
    air_pressure_at_surface: ps
    water_vapor_mixing_ratio_wrt_moist_air: sphum
    cloud_liquid_water: liq_wat
    ozone_mass_mixing_ratio: o3mr
    air_horizontal_streamfunction: psi
    air_horizontal_velocity_potential: chi
background error:
  covariance model: SABER
  saber central block:
    saber block name: BUMP_NICAS
    active variables: &active_vars
    - air_horizontal_streamfunction
    - air_horizontal_velocity_potential
    - air_temperature
    - air_pressure_at_surface
    - water_vapor_mixing_ratio_wrt_moist_air
    - cloud_liquid_water
    - ozone_mass_mixing_ratio
    read:
      io:
        data directory: Data/staticb
        files prefix: nicas_gfs
      drivers:
        multivariate strategy: univariate
        read universe radius: true
        read local nicas: true
      grids:
      - model:
          variables:
          - air_horizontal_streamfunction
          - air_horizontal_velocity_potential
          - air_temperature
          - water_vapor_mixing_ratio_wrt_moist_air
          - cloud_liquid_water
          - ozone_mass_mixing_ratio
        io:
          overriding universe radius file: cor_3D_gfs_universe_radius
      - model:
          variables:
          - air_pressure_at_surface
        io:
          overriding universe radius file: cor_2D_gfs_universe_radius
  saber outer blocks:
  - saber block name: StdDev
    active variables: *active_vars
    read:
      model file:
        set datetime on read: true
        datetime: 2020-12-15T00:00:00Z
        filetype: fms restart
        psinfile: true
        datapath: Data/staticb/
        filename_core: 20201215.000000.stddev.fv_core.res.nc
        filename_trcr: 20201215.000000.stddev.fv_tracer.res.nc
        filename_sfcd: 20201215.000000.stddev.sfc_data.nc
        filename_sfcw: 20201215.000000.stddev.fv_srf_wnd.res.nc
        filename_cplr: 20201215.000000.stddev.coupler.res
        field io names: *field_io_names
  - saber block name: BUMP_VerticalBalance
    active variables:
    - air_horizontal_streamfunction
    - air_horizontal_velocity_potential
    - air_temperature
    - air_pressure_at_surface
    read:
      general:
        universe length-scale: 2000.0e3
      io:
        data directory: Data/staticb
        files prefix: vbal_gfs
        overriding sampling file: vbal_2020121421_gfs_sampling
      drivers:
        read local sampling: true
        read vertical balance: true
      vertical balance:
        vbal:
        - balanced variable: air_horizontal_velocity_potential
          unbalanced variable: air_horizontal_streamfunction
        - balanced variable: air_temperature
          unbalanced variable: air_horizontal_streamfunction
        - balanced variable: air_pressure_at_surface
          unbalanced variable: air_horizontal_streamfunction
  linear variable change:
    linear variable change name: Control2Analysis
    input variables:
    - air_horizontal_streamfunction
    - air_horizontal_velocity_potential
    - air_temperature
    - air_pressure_at_surface
    - water_vapor_mixing_ratio_wrt_moist_air
    - cloud_liquid_water
    - ozone_mass_mixing_ratio
    output variables: *state_vars
output dirac:
  filetype: fms restart
  datapath: Data/staticb/
  filename_core: dirac_local_%id%_gfs_12pe.fv_core.res.nc
  filename_trcr: dirac_local_%id%_gfs_12pe.fv_tracer.res.nc
  filename_sfcd: dirac_local_%id%_gfs_12pe.sfc_data.nc
  filename_sfcw: dirac_local_%id%_gfs_12pe.fv_srf_wnd.res.nc
  filename_cplr: dirac_local_%id%_gfs_12pe.coupler.res
  field io names: *field_io_names
dirac:
  ndir: 1
  ixdir:
  - 1
  iydir:
  - 1
  ildir:
  - 50
  itdir:
  - 1
  ifdir:
  - air_temperature
test:
  reference filename: testoutput/staticb_dirac_local_gfs_12pe.ref
  test output filename: testoutput/staticb_dirac_local_gfs_12pe.test.out
