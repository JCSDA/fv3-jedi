cost function:
  cost type: 3D-Var
  time window:
    begin: 2020-12-14T23:00:00Z
    length: PT2H
  analysis variables:
  - eastward_wind
  - northward_wind
  - air_temperature
  - air_pressure_thickness
  - water_vapor_mixing_ratio_wrt_moist_air
  geometry:
    fms initialization:
      namelist filename: Data/fv3files/fmsmpp.nml
      field table filename: Data/fv3files/field_table_lam_rrfs
    namelist filename: Data/fv3files/input_lam_rrfs.nml
    akbk: Data/inputs/lam_rrfs/INPUT/akbk65.nc
  background:
    datetime: 2020-12-15T00:00:00Z
    filetype: fms restart
    use_fms_lib: false
    datapath: Data/inputs/lam_rrfs/bkg
    filename_core: 20201215.000000.rrfs_C403.fv_core.res.tile1.nc
    filename_trcr: 20201215.000000.rrfs_C403.fv_tracer.res.tile1.nc
    filename_sfcw: 20201215.000000.rrfs_C403.fv_srf_wnd.res.tile1.nc
    filename_sfcd: 20201215.000000.rrfs_C403.sfc_data.nc
    filename_cplr: 20201215.000000.rrfs_C403.coupler.res
    state variables:
    - eastward_wind
    - northward_wind
    - air_temperature
    - air_pressure_thickness
    - water_vapor_mixing_ratio_wrt_moist_air
    field io names: &field_io_names
      eastward_wind: ua
      northward_wind: va
      air_temperature: T
      air_pressure_thickness: DELP
      water_vapor_mixing_ratio_wrt_moist_air: sphum
  background error:
    covariance model: SABER
    saber central block:
      saber block name: ID
  observations:
    observers:
    - obs space:
        name: Aircraft
        obsdatain:
          engine:
            type: H5File
            obsfile: Data/obs/testinput_tier_1/aircraft_obs_2020121500_m.nc4
        simulated variables:
        - windEastward
        - windNorthward
        - airTemperature
        - specificHumidity
      obs operator:
        name: VertInterp
        vertical coordinate: air_pressure
        observation vertical coordinate: pressure
        observation vertical coordinate group: MetaData
        interpolation method: log-linear
variational:
  minimizer:
    algorithm: PCG
  iterations:
  - ninner: 10
    gradient norm reduction: 1e-10
    test: on
    geometry:
      namelist filename: Data/fv3files/input_lam_rrfs.nml
      akbk: Data/inputs/lam_rrfs/INPUT/akbk65.nc
output:
  filetype: fms restart
  use_fms_lib: false
  datapath: Data/analysis/
  prefix: 20201215.000000.rrfs_C403_nofms
  frequency: PT1H
  field io names: *field_io_names
test:
  reference filename: testoutput/3dvar_rrfs_nofms.ref
  test output filename: testoutput/3dvar_rrfs_nofms.test.out
  float relative tolerance: 1.0e-3
