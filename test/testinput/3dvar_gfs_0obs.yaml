cost function:
  cost type: 3D-Var
  time window:
    begin: 2020-12-14T21:00:00Z
    length: PT6H
  analysis variables: &3dvars
  - eastward_wind
  - northward_wind
  - air_temperature
  - air_pressure_thickness
  - water_vapor_mixing_ratio_wrt_moist_air
  geometry:
    fms initialization:
      namelist filename: Data/fv3files/fmsmpp.nml
      field table filename: Data/fv3files/field_table_gfdl
    akbk: Data/inputs/fv3files/akbk127.nc4
    npx: 25
    npy: 25
    npz: 127
  background:
    datetime: 2020-12-15T00:00:00Z
    filetype: fms restart
    datapath: Data/
    filename_core: 20201215.000000.c24.fv_core.res.nc
    filename_trcr: 20201215.000000.c24.fv_tracer.res.nc
    filename_sfcd: 20201215.000000.c24.sfc_data.nc
    filename_sfcw: 20201215.000000.c24.fv_srf_wnd.res.nc
    filename_cplr: 20201215.000000.c24.coupler.res
    state variables:
    - eastward_wind
    - northward_wind
    - air_temperature
    - air_pressure_thickness
    - water_vapor_mixing_ratio_wrt_moist_air
    field io names: &field_io_names
      eastward_wind: ua
      northward_wind: va
      air_temperature: T
      air_pressure_thickness: delp
      water_vapor_mixing_ratio_wrt_moist_air: sphum
  background error:
    covariance model: SABER
    saber central block:
      saber block name: ID
  observations:
    observers:
    - obs space:
        name: Radiosonde
        obsdatain:
          engine:
            type: H5File
            obsfile: Data/obs/testinput_tier_1/sondes_obs_2020121500_m.nc4
        simulated variables:
        - windEastward
        - windNorthward
        - airTemperature
      obs operator:
        name: VertInterp
        vertical coordinate: air_pressure
        observation vertical coordinate: pressure
        observation vertical coordinate group: MetaData
        interpolation method: log-linear
      obs error:
        covariance model: diagonal
      obs filters:
      - filter: Bounds Check
        filter variables:
        - name: airTemperature
        minvalue: 500.0
      - filter: Bounds Check
        filter variables:
        - name: windEastward
        - name: windNorthward
        minvalue: 250.0
    - obs space:
        name: Empty
        obsdatain:
          engine:
            type: H5File
            obsfile: Data/obs/testinput_tier_1/empty_obs_file.nc4
        simulated variables:
        - windEastward
        - windNorthward
        - airTemperature
      obs operator:
        name: VertInterp
        vertical coordinate: air_pressure
        observation vertical coordinate: pressure
        observation vertical coordinate group: MetaData
        interpolation method: log-linear
      obs error:
        covariance model: diagonal
      obs filters:
      - filter: Bounds Check
        filter variables:
        - name: airTemperature
        minvalue: 100.0
        where:
        - variable:
            name: ObsType/airTemperature
          is_in: 130
        minvalue: 250.0
output:
  filetype: fms restart
  datapath: Data/analysis/
  prefix: 3dvar-gfs_0obs
  frequency: PT1H
  field io names: *field_io_names
variational:
  minimizer:
    algorithm: DRPCG
  iterations:
  - ninner: 10
    gradient norm reduction: 1e-10
    test: on
    geometry:
      akbk: Data/inputs/fv3files/akbk127.nc4
      npx: 13
      npy: 13
      npz: 127
  - ninner: 5
    gradient norm reduction: 1e-10
    test: on
    geometry:
      akbk: Data/inputs/fv3files/akbk127.nc4
      npx: 13
      npy: 13
      npz: 127
test:
  reference filename: testoutput/3dvar_gfs_0obs.ref
  test output filename: testoutput/3dvar_gfs_0obs.test.out
  float relative tolerance: 1.0e-4
  float absolute tolerance: 1.0e-4
