  filetype: fms restart
  datapath: Data/inputs/gfs_c12/bkg/
  filename_core: 20201215.000000.fv_core.res.nc
  filename_trcr: 20201215.000000.fv_tracer.res.nc
  filename_sfcd: 20201215.000000.sfc_data.nc
  filename_sfcw: 20201215.000000.fv_srf_wnd.res.nc
  filename_cplr: 20201215.000000.coupler.res
  state variables:
  - eastward_wind
  - northward_wind
  - air_temperature
  - air_pressure_thickness
  - water_vapor_mixing_ratio_wrt_moist_air
  - cloud_liquid_ice
  - cloud_liquid_water
  - ozone_mass_mixing_ratio
  - geopotential_height_times_gravity_at_surface
  - slmsk
  - sheleg
  - skin_temperature_at_surface
  - vtype
  - stype
  - vfrac
  - stc
  - soilMoistureVolumetric
  - totalSnowDepth
  - eastward_wind_at_surface
  - northward_wind_at_surface
  - f10m
  field io names: *field_io_names
observations:
  get values:
    variable change:
      variable change name: Model2GeoVaLs
      hydrometeor effective radii method: gsi
      mask over: land
  observers:
  - obs space:
      name: AMSUA-NOAA19
      obsdatain:
        engine:
          type: H5File
          obsfile: Data/obs/testinput_tier_1/amsua_n19_obs_2020121500_m.nc4
      obsdataout:
        engine:
          type: H5File
          obsfile: Data/hofx/amsua_n19_hofx_gfs_2020121500_m.nc4
      simulated variables:
      - brightnessTemperature
      channels: 1-15
    obs operator:
      name: CRTM
      Absorbers:
      - H2O
      - O3
      - CO2
      Clouds:
      - Water
      - Ice
      Cloud_Fraction: 1.0
      obs options:
        Sensor_ID: amsua_n19
        EndianType: little_endian
        CoefficientPath: Data/crtm/
      do fov average: true
      fov sample points per semimajor axis: 4
test:
  reference filename: testoutput/hofx_nomodel_amsua_fov.ref
  test output filename: testoutput/hofx_nomodel_amsua_fov.test.out
