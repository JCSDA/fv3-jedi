input geometry:
  fms initialization:
    namelist filename: Data/fv3files/input_geos_c12.nml
    field table filename: Data/fv3files/field_table_gmao
  akbk: Data/inputs/fv3files/akbk72.nc4
  layout:
  - 1
  - 2
  npx: 13
  npy: 13
  npz: 72
output geometry:
  akbk: Data/inputs/fv3files/akbk72.nc4
  layout:
  - 1
  - 2
  npx: 13
  npy: 13
  npz: 72
variable change:
  variable change name: Control2Analysis
  output variables:
  - air_horizontal_streamfunction
  - air_horizontal_velocity_potential
  - air_temperature
  - air_pressure_at_surface
  - water_vapor_mixing_ratio_wrt_moist_air
  do inverse: true
  femps_iterations: 60
  femps_ngrids: 2
  femps_path2fv3gridfiles: Data/inputs/femps/
  femps_checkconvergence: false
states:
- input:
    datetime: _YYYY_-_MM_-_DD_T_HH_:00:00Z
    filetype: cube sphere history
    provider: geos
    state variables: &readvars
    - eastward_wind
    - northward_wind
    - air_temperature
    - air_pressure_thickness
    - water_vapor_mixing_ratio_wrt_moist_air
    datapath: Data/inputs/geos_c12
    filename: geos.mem001._YYYY__MM__DD___HH_0000z.nc4
    field io names: &field_io_names
      air_horizontal_streamfunction: psi
      air_horizontal_velocity_potential: chi
      air_temperature: t
      air_pressure_at_surface: ps
      water_vapor_mixing_ratio_wrt_moist_air: q
      eastward_wind: ua
      northward_wind: va
      air_pressure_thickness: delp
  output:
    filetype: cube sphere history
    provider: geos
    datapath: Data/staticb/balanced/mem001/
    filename: geos._YYYY__MM__DD_._HH_0000z.nc4
    field io names: *field_io_names
