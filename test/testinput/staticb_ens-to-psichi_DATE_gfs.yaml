input geometry:
  fms initialization:
    namelist filename: Data/fv3files/fmsmpp.nml
    field table filename: Data/fv3files/field_table_gfdl
  akbk: Data/inputs/fv3files/akbk127.nc4
  layout:
  - 1
  - 2
  npx: 13
  npy: 13
  npz: 127
output geometry:
  akbk: Data/inputs/fv3files/akbk127.nc4
  layout:
  - 1
  - 2
  npx: 13
  npy: 13
  npz: 127
variable change:
  variable change name: Control2Analysis
  output variables:
  - air_horizontal_streamfunction
  - air_horizontal_velocity_potential
  - air_temperature
  - air_pressure_at_surface
  - water_vapor_mixing_ratio_wrt_moist_air
  - cloud_liquid_water
  - cloud_liquid_ice
  - ozone_mass_mixing_ratio
  do inverse: true
  femps_iterations: 60
  femps_ngrids: 2
  femps_path2fv3gridfiles: Data/inputs/femps/
  femps_checkconvergence: false
states:
- input:
    datetime: _YYYY_-_MM_-_DD_T_HH_:00:00Z
    filetype: fms restart
    state variables: &readvars
    - eastward_wind
    - northward_wind
    - air_temperature
    - air_pressure_thickness
    - water_vapor_mixing_ratio_wrt_moist_air
    - cloud_liquid_water
    - cloud_liquid_ice
    - ozone_mass_mixing_ratio
    datapath: Data/inputs/gfs_c12/mem001/
    filename_core: _YYYY__MM__DD_._HH_0000.fv_core.res.nc
    filename_trcr: _YYYY__MM__DD_._HH_0000.fv_tracer.res.nc
    filename_sfcd: _YYYY__MM__DD_._HH_0000.sfc_data.nc
    filename_sfcw: _YYYY__MM__DD_._HH_0000.fv_srf_wnd.res.nc
    filename_cplr: _YYYY__MM__DD_._HH_0000.coupler.res
    field io names: &field_io_names
      air_horizontal_streamfunction: psi
      air_horizontal_velocity_potential: chi
      air_temperature: T
      air_pressure_at_surface: ps
      water_vapor_mixing_ratio_wrt_moist_air: sphum
      cloud_liquid_water: liq_wat
      cloud_liquid_ice: ice_wat
      ozone_mass_mixing_ratio: o3mr
      eastward_wind: ua
      northward_wind: va
      air_pressure_thickness: delp
  output:
    filetype: fms restart
    datapath: Data/staticb/balanced/mem001/
    filename_core: fv_core.res.nc
    filename_trcr: fv_tracer.res.nc
    filename_sfcd: sfc_data.nc
    filename_sfcw: fv_srf_wnd.res.nc
    filename_cplr: coupler.res
    field io names: *field_io_names
