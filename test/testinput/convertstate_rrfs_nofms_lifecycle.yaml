# Lifecycle test of the non-FMS (use_fms_lib: false) regional restart I/O.
#
# fv3jedi_convertstate.x reads and writes each state in turn, in ONE MPI execution:
#   state 1: read bkg          -> write A (32-bit)   first read and first write
#   state 2: read bkg again    -> write B (native)   read AFTER a write, same grid and fields
#   state 3: read A back       -> write C (native)   read of a file written by this writer, in a
#                                                     different precision from the bkg; ps rebuilt
#                                                     from DELP (delp not requested)
# Every read and write must build and free its own parallel-I/O state, so none of these
# sequences may reuse state left behind by a previous call.
input geometry:
  fms initialization:
    namelist filename: Data/fv3files/fmsmpp.nml
    field table filename: Data/fv3files/field_table_lam_rrfs
  namelist filename: Data/fv3files/input_lam_rrfs.nml
  akbk: Data/inputs/lam_rrfs/INPUT/akbk65.nc
output geometry:
  namelist filename: Data/fv3files/input_lam_rrfs.nml
  akbk: Data/inputs/lam_rrfs/INPUT/akbk65.nc
states:
- input:
    datetime: 2020-12-15T00:00:00Z
    filetype: fms restart
    use_fms_lib: false
    datapath: Data/inputs/lam_rrfs/bkg
    filename_core: 20201215.000000.rrfs_C403.fv_core.res.tile1.nc
    filename_trcr: 20201215.000000.rrfs_C403.fv_tracer.res.tile1.nc
    filename_sfcw: 20201215.000000.rrfs_C403.fv_srf_wnd.res.tile1.nc
    filename_sfcd: 20201215.000000.rrfs_C403.sfc_data.nc
    filename_cplr: 20201215.000000.rrfs_C403.coupler.res
    state variables: &state_vars
    - eastward_wind
    - northward_wind
    - air_temperature
    - air_pressure_thickness
    - water_vapor_mixing_ratio_wrt_moist_air
    - air_pressure_at_surface
    field io names: &field_io_names
      eastward_wind: ua
      northward_wind: va
      air_temperature: T
      air_pressure_thickness: DELP
      water_vapor_mixing_ratio_wrt_moist_air: sphum
  output:
    filetype: fms restart
    use_fms_lib: false
    datapath: Data/analysis/
    prefix: 20201215.000000.rrfs_C403_lifecycleA
    default output resolution: 32bit
    field io names: *field_io_names
- input:
    datetime: 2020-12-15T00:00:00Z
    filetype: fms restart
    use_fms_lib: false
    datapath: Data/inputs/lam_rrfs/bkg
    filename_core: 20201215.000000.rrfs_C403.fv_core.res.tile1.nc
    filename_trcr: 20201215.000000.rrfs_C403.fv_tracer.res.tile1.nc
    filename_sfcw: 20201215.000000.rrfs_C403.fv_srf_wnd.res.tile1.nc
    filename_sfcd: 20201215.000000.rrfs_C403.sfc_data.nc
    filename_cplr: 20201215.000000.rrfs_C403.coupler.res
    state variables: *state_vars
    field io names: *field_io_names
  output:
    filetype: fms restart
    use_fms_lib: false
    datapath: Data/analysis/
    prefix: 20201215.000000.rrfs_C403_lifecycleB
    field io names: *field_io_names
- input:
    datetime: 2020-12-15T00:00:00Z
    filetype: fms restart
    use_fms_lib: false
    datapath: Data/analysis/
    filename_core: 20201215.000000.rrfs_C403_lifecycleA.20201215.000000.fv_core.res.nc
    filename_trcr: 20201215.000000.rrfs_C403_lifecycleA.20201215.000000.fv_tracer.res.nc
    filename_cplr: 20201215.000000.rrfs_C403_lifecycleA.20201215.000000.coupler.res
    state variables:
    - eastward_wind
    - northward_wind
    - air_temperature
    - water_vapor_mixing_ratio_wrt_moist_air
    - air_pressure_at_surface
    field io names: *field_io_names
  output:
    filetype: fms restart
    use_fms_lib: false
    datapath: Data/analysis/
    prefix: 20201215.000000.rrfs_C403_lifecycleC
    field io names: *field_io_names
test:
  reference filename: testoutput/convertstate_rrfs_nofms_lifecycle.ref
  test output filename: testoutput/convertstate_rrfs_nofms_lifecycle.test.out
  float relative tolerance: 1.0e-6
