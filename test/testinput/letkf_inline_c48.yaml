geometry:
  fms initialization:
    namelist filename: Data/ModelRunDirs/c48_001/input.nml
    field table filename: Data/ModelRunDirs/UFS_warmstart_1/field_table
  akbk: Data/inputs/fv3files/akbk127.nc4
  npx: 49
  npy: 49
  npz: 127
  member_number: 0
  layout:
  - 1
  - 2
time window:
  begin: &date 2021-03-23T12:00:00Z
  length: PT6H

Run Inline: True
inline parameters:
  Forecast configuration:
  - testinput/forecast_c48_001.yaml
  - testinput/forecast_c48_002.yaml
  Compute HofX Only: false
  forecast batch size: 1
  zero padding: 2
  output file pattern: '%ensmem%'

background:
   members from template:
     template:
       datetime: 2021-03-23T12:00:00Z
       filetype: fms restart
       state variables:
       - eastward_wind
       - northward_wind
       - air_temperature
       - air_pressure_thickness
       - water_vapor_mixing_ratio_wrt_moist_air
       - cloud_liquid_ice
       - cloud_liquid_water
       - ozone_mass_mixing_ratio
       - geopotential_height_times_gravity_at_surface
       - slmsk
       - sheleg
       - sea_surface_temperature
       - vtype
       - stype
       - vfrac
       - stc
       - soilMoistureVolumetric
       - totalSnowDepth
       - eastward_wind_at_surface
       - northward_wind_at_surface
       - f10m
       field io names: &field_io_names
         eastward_wind: ua
         northward_wind: va
         air_temperature: T
         air_pressure_thickness: delp
         water_vapor_mixing_ratio_wrt_moist_air: sphum
         cloud_liquid_ice: ice_wat
         cloud_liquid_water: liq_wat
         ozone_mass_mixing_ratio: o3mr
         geopotential_height_times_gravity_at_surface: phis
         sea_surface_temperature: tsea
         soilMoistureVolumetric: smc
         totalSnowDepth: snwdph
         eastward_wind_at_surface: u_srf
         northward_wind_at_surface: v_srf
       datapath: Data/ModelRunDirs/UFS_warmstart_%mem%/RESTART
       filename_core: 20210323.120000.fv_core.res.nc
       filename_trcr: 20210323.120000.fv_tracer.res.nc
       filename_sfcd: 20210323.120000.sfc_data.nc
       filename_sfcw: 20210323.120000.fv_srf_wnd.res.nc
       filename_cplr: 20210323.120000.coupler.res
     pattern: '%mem%'
     nmembers: 2
     zero padding: 1

observations:
  observers:
  - obs space:
      name: Scatwind
      distribution:
        name: Halo
        halo size: 5000e3
      obsdatain:
        engine:
          type: H5File
#         obsfile: Data/hofx/new/scatwind_letkf-gfs_2020121500_m.nc4
          obsfile: Data/obs/testinput_tier_1/scatwind_obs_2021032312.nc4
#         obsfile: Data/hofx/scatwind_letkf-gfs_2020121500_m.nc4
      obsdataout:
        engine:
          type: H5File
          obsfile: Data/hofx/scatwind_letkf-member%ensmem%-gfs_2021032312.nc4
        write multiple files: false
      io pool:
        max pool size: 1
      simulated variables:
      - windEastward
      - windNorthward
    obs operator:
      name: VertInterp
      vertical coordinate: air_pressure
      observation vertical coordinate: pressure
      observation vertical coordinate group: MetaData
      interpolation method: log-linear
    obs error:
      covariance model: diagonal
    obs localizations:
    - localization method: Horizontal Box car
      lengthscale: 5000e3
      max nobs: 1000
  - obs space:
      name: AMSUA-NOAA19
      distribution:
        name: Halo
        halo size: 5000e3
      obsdatain:
        engine:
          type: H5File
#         obsfile: Data/hofx/new/amsua_n19_letkf-gfs_2020121500_m.nc4
          obsfile: Data/obs/testinput_tier_1/amsua_n19_obs_2021032312.nc4
#         obsfile: Data/hofx/amsua_n19_letkf-gfs_2020121500_m.nc4
      obsdataout:
        engine:
          type: H5File
          obsfile: Data/hofx/amsua_n19_letkf-member%ensmem%-gfs_2021032312.nc4
        write multiple files: false
      io pool:
        max pool size: 1
      simulated variables:
      - brightnessTemperature
      channels: 4-6,9-14
    obs operator:
      name: CRTM
      Absorbers:
      - H2O
      - O3
      obs options:
        Sensor_ID: amsua_n19
        EndianType: little_endian
        CoefficientPath: Data/crtm/
    obs error:
      covariance model: diagonal
    obs filters:
    - filter: Bounds Check
      filter variables:
      - name: brightnessTemperature
        channels: 4-6,9-14
      minvalue: 100.0
      maxvalue: 500.0
    - filter: Background Check
      filter variables:
      - name: brightnessTemperature
        channels: 4-6,9-14
      threshold: 3.0
    obs localizations:
    - localization method: Horizontal Gaspari-Cohn
      lengthscale: 1000e3
      max nobs: 100
  - obs space:
      name: SfcObs
      distribution:
        name: Halo
        halo size: 2000e3
      obsdatain:
        engine:
          type: H5File
#         obsfile: Data/hofx/new/sfc_letkf-gfs_2020121500_m.nc4
          obsfile: Data/obs/testinput_tier_1/sfc_ps_obs_2021032312.nc4
#         obsfile: Data/hofx/sfc_letkf-gfs_2020121500_m.nc4
      obsdataout:
        engine:
          type: H5File
          obsfile: Data/hofx/sfc_letkf-member%ensmem%-gfs_2021032312.nc4
        write multiple files: false
      simulated variables:
      - stationPressure
      io pool:
        max pool size: 1
    obs operator:
      name: SfcCorrected
      correction scheme to use: UKMO
    linear obs operator:
      name: Identity
    obs error:
      covariance model: diagonal
    obs filters:
    - filter: Background Check
      threshold: 1000
    obs localizations:
    - localization method: Horizontal SOAR
      soar horizontal decay: 0.000018
      lengthscale: 2000e3
      max nobs: 1000

driver:
  save posterior ensemble: false
  save posterior mean: true
  save posterior mean increment: false
  save posterior ensemble increments: false
  read HX from disk: false
  do test prints: true
  do posterior observer: true
  run as observer only: false
local ensemble DA:
  solver: Deterministic LETKF
  inflation:
    rtps: 0.5
    rtpp: 0.6
    mult: 1.1

# for realistic output, use gfs filetype for output
# here we are using latlon for ease of visualisation
output:
  filetype: fms restart
  datapath: Data/analysis/letkf/gfs
  gridtype: native grid
  filename_core: fv_core.res.nc
  filename_trcr: fv_tracer.res.nc
  filename_sfcd: sfc_data.nc
  filename_sfcw: fv_srf_wnd.res.nc
  filename_cplr: coupler.res

output increment:
  filetype: auxgrid
  gridtype: latlon
  filename: Data/analysis/letkf/gfs/mem%{member}%/xainc.

output ensemble increments:
  filetype: auxgrid
  gridtype: latlon
  filename: Data/analysis/letkf/gfs/mem%{member}%/ensinc.
