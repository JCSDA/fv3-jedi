geometry:
  fms initialization:
    namelist filename: Data/fv3files/fmsmpp.nml
    field table filename: Data/fv3files/field_table_gfdl
  akbk: Data/inputs/fv3files/akbk127.nc4
  layout:
  - 1
  - 2
  npx: 13
  npy: 13
  npz: 127
background:
  datetime: 2020-12-15T00:00:00Z
  filetype: fms restart
  state variables: &state_vars
  - eastward_wind
  - northward_wind
  - air_temperature
  - air_pressure_thickness
  - air_pressure_at_surface
  - water_vapor_mixing_ratio_wrt_moist_air
  - cloud_liquid_ice
  - cloud_liquid_water
  - ozone_mass_mixing_ratio
  datapath: Data/inputs/gfs_c12/bkg
  filename_core: 20201215.000000.fv_core.res.nc
  filename_trcr: 20201215.000000.fv_tracer.res.nc
  filename_sfcd: 20201215.000000.sfc_data.nc
  filename_sfcw: 20201215.000000.fv_srf_wnd.res.nc
  filename_cplr: 20201215.000000.coupler.res
  field io names: &field_io_names
    eastward_wind: ua
    northward_wind: va
    air_temperature: T
    air_pressure_thickness: delp
    air_pressure_at_surface: ps
    water_vapor_mixing_ratio_wrt_moist_air: sphum
    cloud_liquid_ice: ice_wat
    cloud_liquid_water: liq_wat
    ozone_mass_mixing_ratio: o3mr
background error:
  covariance model: ensemble
  members from template:
    template:
      datetime: 2020-12-15T00:00:00Z
      filetype: fms restart
      state variables:
      - eastward_wind
      - northward_wind
      - air_temperature
      - air_pressure_thickness
      - air_pressure_at_surface
      - water_vapor_mixing_ratio_wrt_moist_air
      - cloud_liquid_ice
      - cloud_liquid_water
      - ozone_mass_mixing_ratio
      datapath: Data/inputs/gfs_c12/mem%mem%/
      filename_core: 20201215.000000.fv_core.res.nc
      filename_trcr: 20201215.000000.fv_tracer.res.nc
      filename_sfcd: 20201215.000000.sfc_data.nc
      filename_sfcw: 20201215.000000.fv_srf_wnd.res.nc
      filename_cplr: 20201215.000000.coupler.res
      field io names: *field_io_names
    pattern: '%mem%'
    nmembers: 10
    zero padding: 3
  localization:
    localization method: SABER
    saber central block:
      saber block name: BUMP_NICAS
      read:
        io:
          files prefix: Data/ensembleb/nicas_gfs
        drivers:
          multivariate strategy: duplicated
          read local nicas: true
output dirac:
  filetype: fms restart
  datapath: Data/ensembleb/
  filename_core: dirac_local_%id%_gfs_12pe.fv_core.res.nc
  filename_trcr: dirac_local_%id%_gfs_12pe.fv_tracer.res.nc
  filename_sfcd: dirac_local_%id%_gfs_12pe.sfc_data.nc
  filename_sfcw: dirac_local_%id%_gfs_12pe.fv_srf_wnd.res.nc
  filename_cplr: dirac_local_%id%_gfs_12pe.coupler.res
  field io names: *field_io_names
dirac:
  ndir: 1
  ixdir:
  - 1
  iydir:
  - 1
  ildir:
  - 50
  itdir:
  - 1
  ifdir:
  - air_temperature
test:
  reference filename: testoutput/ensembleb_dirac_local_gfs_12pe.ref
  test output filename: testoutput/ensembleb_dirac_local_gfs_12pe.test.out
