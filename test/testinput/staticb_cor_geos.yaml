geometry:
  fms initialization:
    namelist filename: Data/fv3files/input_geos_c12.nml
    field table filename: Data/fv3files/field_table_gmao
  akbk: Data/inputs/fv3files/akbk72.nc4
  layout:
  - 1
  - 2
  npx: 13
  npy: 13
  npz: 72
background:
  datetime: 2020-12-15T00:00:00Z
  filetype: cube sphere history
  provider: geos
  state variables:
  - air_horizontal_streamfunction
  - air_horizontal_velocity_potential
  - air_temperature
  - air_pressure_at_surface
  - water_vapor_mixing_ratio_wrt_moist_air
  datapath: Data/staticb/unbalanced/mem001
  filename: geos.20201215.000000z.nc4
  field io names: &field_io_names
    air_horizontal_streamfunction: psi
    air_horizontal_velocity_potential: chi
    air_temperature: t
    air_pressure_at_surface: ps
    water_vapor_mixing_ratio_wrt_moist_air: q
background error:
  covariance model: SABER
  saber central block:
    saber block name: BUMP_NICAS
    calibration:
      general:
        universe length-scale: 5000.0e3
      io:
        data directory: Data/staticb
      drivers:
        compute covariance: true
        compute correlation: true
        multivariate strategy: univariate
        read local sampling: true
        read moments: true
        write diagnostics: true
        write diagnostics detail: true
        write universe radius: true
      ensemble sizes:
        total ensemble size: 30
        sub-ensembles: 3
      sampling:
        distance classes: 10
        distance class width: 500.0e3
        reduced levels: 5
      diagnostics:
        target ensemble size: 30
      fit:
        vertical filtering length-scale: 0.1
        number of components: 2
      grids:
      - model:
          variables:
          - air_horizontal_streamfunction
          - air_horizontal_velocity_potential
          - air_temperature
          - water_vapor_mixing_ratio_wrt_moist_air
        io:
          files prefix: cor_3D_geos
          overriding sampling file: var-mom_3D_2020121421_geos_sampling
          overriding moments file:
          - var-mom_3D_2020121421_geos_mom_000001
          - var-mom_3D_2020121500_geos_mom_000001
          - var-mom_3D_2020121503_geos_mom_000001
      - model:
          variables:
          - air_pressure_at_surface
        io:
          files prefix: cor_2D_geos
          overriding sampling file: var-mom_2D_2020121421_geos_sampling
          overriding moments file:
          - var-mom_2D_2020121421_geos_mom_000001
          - var-mom_2D_2020121500_geos_mom_000001
          - var-mom_2D_2020121503_geos_mom_000001
      output model files:
      - parameter: cor_a
        component: 1
        file:
          filetype: cube sphere history
          provider: geos
          datapath: Data/staticb/
          filename: geos.20201215.000000.cor_a_1.nc4
          field io names: *field_io_names
      - parameter: cor_a
        component: 2
        file:
          filetype: cube sphere history
          provider: geos
          datapath: Data/staticb/
          filename: geos.20201215.000000.cor_a_2.nc4
          field io names: *field_io_names
      - parameter: cor_rh
        component: 1
        file:
          filetype: cube sphere history
          provider: geos
          datapath: Data/staticb/
          filename: geos.20201215.000000.cor_rh_1.nc4
          field io names: *field_io_names
      - parameter: cor_rh
        component: 2
        file:
          filetype: cube sphere history
          provider: geos
          datapath: Data/staticb/
          filename: geos.20201215.000000.cor_rh_2.nc4
          field io names: *field_io_names
      - parameter: cor_rv
        component: 1
        file:
          filetype: cube sphere history
          provider: geos
          datapath: Data/staticb/
          filename: geos.20201215.000000.cor_rv_1.nc4
          field io names: *field_io_names
      - parameter: cor_rv
        component: 2
        file:
          filetype: cube sphere history
          provider: geos
          datapath: Data/staticb/
          filename: geos.20201215.000000.cor_rv_2.nc4
          field io names: *field_io_names
test:
  reference filename: testoutput/staticb_cor_geos.ref
  test output filename: testoutput/staticb_cor_geos.test.out
