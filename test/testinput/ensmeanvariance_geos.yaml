geometry:
  fms initialization:
    namelist filename: Data/fv3files/input_geos_c12.nml
    field table filename: Data/fv3files/field_table_gmao
  akbk: Data/inputs/fv3files/akbk72.nc4
  npx: 13
  npy: 13
  npz: 72
variance output:
  filetype: cube sphere history
  provider: geos
  datapath: Data/ensvariance
  filename: geos.ensemblevariance.%yyyy%mm%dd_%hh%MM%ssz.nc4
  field io names: &field_io_names
    eastward_wind: ua
    northward_wind: va
    air_temperature: t
    air_pressure_thickness: delp
    water_vapor_mixing_ratio_wrt_moist_air: q
    cloud_liquid_ice: qi
    cloud_liquid_water: ql
mean output:
  filetype: cube sphere history
  provider: geos
  datapath: Data/ensvariance
  filename: geos.ensemblemean.%yyyy%mm%dd_%hh%MM%ssz.nc4
  field io names: *field_io_names
ensemble:
  members from template:
    template:
      datetime: 2020-12-15T00:00:00Z
      filetype: cube sphere history
      provider: geos
      state variables:
      - eastward_wind
      - northward_wind
      - air_temperature
      - air_pressure_thickness
      - water_vapor_mixing_ratio_wrt_moist_air
      - cloud_liquid_ice
      - cloud_liquid_water
      datapath: Data/inputs/geos_c12
      filename: geos.mem%mem%.20201215_000000z.nc4
      field io names: *field_io_names
    pattern: '%mem%'
    nmembers: 10
    zero padding: 3
test:
  reference filename: testoutput/ensmeanvariance_geos.ref
  test output filename: testoutput/ensmeanvariance_geos.test.out
